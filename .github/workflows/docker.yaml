name: Docker

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  ALIYUN_REGISTRY: "${{ secrets.ALIYUN_REGISTRY }}"
  ALIYUN_NAME_SPACE: "${{ secrets.ALIYUN_NAME_SPACE }}"
  ALIYUN_REGISTRY_USER: "${{ secrets.ALIYUN_REGISTRY_USER }}"
  ALIYUN_REGISTRY_PASSWORD: "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}"

jobs:
  build:
    name: Pull and Push
    runs-on: ubuntu-latest
    steps:

    # ============================================================
    # 1. 先看一眼磁盘原始状态
    # ============================================================
    - name: Before freeing up disk space
      run: |
        echo "Before freeing up disk space"
        echo "=============================================================================="
        df -hT
        echo "=============================================================================="

    # ============================================================
    # 2. 清理 Runner 自身缓存（直接对应你的报错路径）
    # ============================================================
    - name: Clean runner cached dir
      run: |
        echo "Cleaning runner cache..."
        rm -rf /home/runner/actions-runner/cached/* || true
        df -hT

    # ============================================================
    # 3. 最大化磁盘空间（参数调优）
    # ============================================================
    - name: Maximize build space
      uses: easimon/maximize-build-space@master
      with:
        root-reserve-mb: 1024
        swap-size-mb: 256
        remove-dotnet: 'true'
        remove-haskell: 'true'
        remove-android: 'true'
        remove-codeql: 'true'
        build-mount-path: '/var/lib/docker/'

    # ============================================================
    # 4. 重启 Docker + 确认磁盘
    # ============================================================
    - name: Restart docker
      run: sudo service docker restart

    - name: Free up disk space complete
      run: |
        echo "Free up disk space complete"
        echo "=============================================================================="
        df -hT
        echo "=============================================================================="

    # ============================================================
    # 5. 拉代码
    # ============================================================
    - name: Checkout Code
      uses: actions/checkout@v4

    # ============================================================
    # 6. Docker Buildx（保留，不影响后面逻辑）
    # ============================================================
    - name: Docker Setup Buildx
      uses: docker/setup-buildx-action@v3

    # ============================================================
    # 7. 登录 + 拉取 / 推送 / 清理（核心修复）
    # ============================================================
    - name: Build and push image Aliyun
      run: |
        set -e

        docker login -u "$ALIYUN_REGISTRY_USER" -p "$ALIYUN_REGISTRY_PASSWORD" "$ALIYUN_REGISTRY"

        # ---------- 第一阶段：检测重名镜像 ----------
        declare -A duplicate_images
        declare -A temp_map

        while IFS= read -r line || [ -n "$line" ]; do
          [[ -z "$line" ]] && continue
          echo "$line" | grep -q '^\s*#' && continue

          image=$(echo "$line" | awk '{print $NF}')
          image="${image%%@*}"

          image_name_tag=$(echo "$image" | awk -F'/' '{print $NF}')
          name_space=$(echo "$image" | awk -F'/' '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}')
          name_space="${name_space}_"
          image_name=$(echo "$image_name_tag" | awk -F':' '{print $1}')

          if [[ -n "${temp_map[$image_name]}" && "${temp_map[$image_name]}" != "$name_space" ]]; then
            duplicate_images[$image_name]="true"
          fi
          temp_map[$image_name]="$name_space"
        done < images.txt

        # ---------- 第二阶段：逐个拉取 / 推送 / 清理 ----------
        count=0

        while IFS= read -r line || [ -n "$line" ]; do
          [[ -z "$line" ]] && continue
          echo "$line" | grep -q '^\s*#' && continue

          echo "------------------------------------------------------------------------------"
          echo "Processing: $line"
          echo "------------------------------------------------------------------------------"

          # ---- 解析 platform ----
          platform_arg=""
          pull_line="$line"
          if echo "$line" | grep -q '\--platform'; then
            platform=$(echo "$line" | sed 's/.*--platform[= ]*\([^ ]*\).*/\1/')
            platform_arg="--platform $platform"
            pull_line=$(echo "$line" | sed 's/--platform[= ]*[^ ]*//' | xargs)
          fi

          # ---- 拉取镜像 ----
          echo "docker pull $platform_arg $pull_line"
          docker pull $platform_arg "$pull_line"

          # ---- 解析镜像名 ----
          image=$(echo "$pull_line" | awk '{print $NF}')
          image_name_tag=$(echo "$image" | awk -F'/' '{print $NF}')
          name_space=$(echo "$image" | awk -F'/' '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}')
          image_name=$(echo "$image_name_tag" | awk -F':' '{print $1}')
          image_name_tag="${image_name_tag%%@*}"

          platform_prefix=""
          if [[ -n "$platform" ]]; then
            platform_prefix="${platform//\//_}_"
          fi

          name_space_prefix=""
          if [[ -n "${duplicate_images[$image_name]}" && -n "$name_space" ]]; then
            name_space_prefix="${name_space}_"
          fi

          new_image="$ALIYUN_REGISTRY/$ALIYUN_NAME_SPACE/${platform_prefix}${name_space_prefix}${image_name_tag}"

          # ---- Tag & Push ----
          echo "docker tag $image $new_image"
          docker tag "$image" "$new_image"

          echo "docker push $new_image"
          docker push "$new_image"

          # ---- 清理（关键修复）----
          echo "Cleaning up images..."
          docker rmi "$image" || true
          docker rmi "$new_image" || true
          docker system prune -f --volumes || true

          count=$((count + 1))
          if [ $((count % 5)) -eq 0 ]; then
            echo "=== Deep cleanup after $count images ==="
            docker system prune -af --volumes || true
            rm -rf /home/runner/actions-runner/cached/* || true
          fi

          echo "Disk status after $count images:"
          df -hT

        done < images.txt

        echo "All done! ✅"
